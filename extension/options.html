<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormFiller AI - Extension Settings</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .settings-card {
      width: 500px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
    }
    .help {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    #status-msg {
      font-size: 0.8rem;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="settings-card">
    <h2>FormFiller AI - Settings</h2>
    <p>Configure your backend cloud API endpoint or local development server.</p>

    <div class="field">
      <label for="server-url">Backend Server URL</label>
      <input type="text" id="server-url" placeholder="http://localhost:8000" />
      <div class="help">Default: <code>http://localhost:8000</code> or your deployed cloud server URL (e.g. <code>https://my-app.onrender.com</code>).</div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-test">Test Connection</button>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span id="status-msg"></span>
        <button class="btn btn-primary" id="btn-save">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
