version: '3.8'

services:
  formfiller-api:
    build: .
    container_name: formfiller-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - PORT=8000
    volumes:
      # Mount profile.md and history.json for persistence
      - ./profile.md:/app/profile.md
      - ./history.json:/app/history.json
